<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kişisel web sayfam - Merhaba arkadaşlar">
    <title>Benim Sayfam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease-out;
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #555;
            animation: fadeInUp 1s ease-out;
        }
        
        .welcome {
            font-size: 1.4em;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 30px;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #888;
            font-size: 0.9em;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Merhaba Arkadaşlar! 👋</h1>
        <p class="welcome">Bu benim sayfam.</p>
        <p>Kişisel web siteime hoş geldiniz. Bu sayfa Türkçe olarak hazırlanmıştır.</p>
        <p>GitHub Pages üzerinde barındırılan bu basit ama şık sayfa, sizleri karşılamak için tasarlandı.</p>
        <div class="footer">
            <p>© 2026 - Kişisel Web Sayfası</p>
        </div>
    </div>
</body>
</html>
